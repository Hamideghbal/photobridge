<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فروشگاه</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:#17243b;background:#f6f8fc;font:14px/1.8 Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}header{background:white;border-bottom:1px solid #e0e7f1;position:sticky;top:0;z-index:5}header>div{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;gap:15px}header strong{font-size:19px}button,.button{border:0;border-radius:10px;padding:10px 15px;background:#2859e8;color:white}main{max-width:1200px;margin:auto;padding:24px 20px 60px}.intro{background:linear-gradient(110deg,#e5efff,#f7fbff);padding:24px;border:1px solid #dbe6f8;border-radius:18px;margin-bottom:20px}.intro h1{margin:0 0 8px;font-size:27px}.intro p{color:#52617a;margin:0}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}.toolbar input{flex:1;max-width:430px;background:white;border:1px solid #d8e1ed;border-radius:10px;padding:10px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.product{display:flex;flex-direction:column;border:1px solid #dfe6f1;border-radius:15px;background:white;padding:14px;gap:10px;min-width:0}.product img{height:190px;width:100%;object-fit:contain;background:#f8fafc;border-radius:10px}.product h2{font-size:16px;margin:0}.product select{width:100%;min-width:0;border:1px solid #d5dfee;border-radius:8px;padding:7px}.description{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#667085;min-height:48px;font-size:12px;margin:0}.price{margin-top:auto;font-weight:bold;color:#2448a8}.price del{font-size:11px;color:#98a2b3;margin-inline-end:8px}.buy{display:flex;gap:8px}.buy input{width:65px;border:1px solid #d5dfee;border-radius:8px;padding:5px;text-align:center}.buy button{flex:1}.message{color:#b42318;white-space:pre-line}.empty{padding:30px;text-align:center;color:#667085;grid-column:1/-1}.overlay{position:fixed;inset:0;z-index:20;background:#17243b77;display:flex;justify-content:flex-start}.overlay[hidden]{display:none}.cart{width:min(520px,100%);height:100%;background:#fff;overflow:auto;padding:20px}.cart>div:first-child{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-20px;background:white;padding:12px 0;z-index:1}.close{background:#eff3f9;color:#344054;padding:4px 12px;font-size:23px}.cartline{display:grid;grid-template-columns:1fr auto;gap:7px;border-bottom:1px solid #e7ecf3;padding:12px 0}.cartline small{color:#667085}.cartline button{background:#fef0ef;color:#b42318;padding:4px 9px}.checkout{display:grid;gap:12px;margin-top:16px}.checkout label{display:grid;gap:5px}.checkout input,.checkout textarea,.checkout select{width:100%;padding:9px;border:1px solid #d5dfee;border-radius:9px}.total{display:flex;justify-content:space-between;font-weight:bold;padding:14px 0}.bank{border:1px solid #d5dfee;background:#f7faff;border-radius:12px;padding:15px;display:grid;gap:8px;user-select:text}.bank b[dir=ltr]{font-size:20px;letter-spacing:1px}.notice{border-radius:10px;background:#fff6df;padding:10px;color:#805900}footer{color:#667085;text-align:center;padding:20px;border-top:1px solid #e0e7f1}#toast{position:fixed;bottom:20px;left:20px;z-index:30;background:#17243b;color:white;border-radius:10px;padding:10px 18px}#toast:empty{display:none}a{color:#2859e8}@media(max-width:850px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:15px 12px 40px}.products{gap:12px;grid-template-columns:1fr}.intro{padding:18px}.intro h1{font-size:22px}header strong{font-size:16px}}
</style><script defer src="/storefront.js"></script></head><body><header><div><strong id="storeName">فروشگاه</strong><button id="cartButton">سبد خرید <span id="cartCount">۰</span></button></div></header><main><section class="intro"><h1 id="title">در حال دریافت فروشگاه…</h1><p id="about"></p></section><div id="previewNotice" class="notice" hidden>پیش‌نمایش سایت اختصاصی — ثبت سفارش در این حالت غیرفعال است.</div><div class="toolbar"><input id="search" type="search" placeholder="جست‌وجوی کالا…" aria-label="جست‌وجوی کالا"><span id="productCount"></span></div><p id="error" class="message" role="alert"></p><section id="products" class="products"></section><section id="tracking"></section></main><footer id="footer"></footer><div id="cartOverlay" class="overlay" hidden><section class="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle"><div><h2 id="cartTitle">سبد خرید</h2><button id="closeCart" class="close" aria-label="بستن سبد خرید">×</button></div><div id="cartLines"></div><div class="total"><span>جمع سبد</span><b id="cartTotal"></b></div><form id="checkout" class="checkout"><label>نام و نام خانوادگی<input name="name" required minlength="2" maxlength="140" autocomplete="name"></label><label>شماره موبایل<input name="mobile" required inputmode="tel" maxlength="11" autocomplete="tel" placeholder="09xxxxxxxxx"></label><label>نحوه تحویل<select name="deliveryMethod"><option value="pickup">دریافت حضوری</option><option value="courier">ارسال با پیک</option></select></label><label id="addressField" hidden>آدرس تحویل<textarea name="address" maxlength="1000" autocomplete="street-address"></textarea></label><p class="notice">پس از ثبت سفارش، اطلاعات حساب فروشگاه نمایش داده می‌شود. رسید واریز را ارسال کنید تا فروشگاه پرداخت و سفارش را تأیید کند.</p><button type="submit">ثبت سفارش و دریافت اطلاعات واریز</button><p id="checkoutError" role="alert" class="message"></p></form></section></div><div id="toast" role="status"></div></body></html>
