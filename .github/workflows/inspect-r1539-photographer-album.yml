name: Inspect R1539 photographer binding
on:
  pull_request:
    branches: [aaa-liara-release]
    paths:
      - 'scripts/inspect-r1539-photographer-album.cjs'
      - '.github/workflows/inspect-r1539-photographer-album.yml'
      - 'scripts/enable-r1539-album-binding-server.mjs'
      - 'scripts/enable-r1539-photographer-album-binding-ui.mjs'
      - 'scripts/enable-r1539-album-binding-display.mjs'
      - 'scripts/test-r1539-photographer-album-binding.cjs'
      - 'scripts/liara-fast-build.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read only source inspection
        run: node scripts/inspect-r1539-photographer-album.cjs

      - name: Verify R1539 binding selector, pricing, and invoice snapshots
        run: |
          node scripts/enable-r1539-paper-binding-catalog.mjs
          node scripts/enable-r1539-paper-binding-ui.mjs
          node scripts/enable-r1539-album-binding-server.mjs
          node scripts/enable-r1539-photographer-album-binding-ui.mjs
          node scripts/enable-r1539-album-binding-display.mjs
          node --check dist/api/server.js
          node --check dist/web/assets/index-UIRefine-v655-r84.js
          node --test scripts/test-r1539-paper-binding-catalog.cjs scripts/test-r1539-photographer-album-binding.cjs
