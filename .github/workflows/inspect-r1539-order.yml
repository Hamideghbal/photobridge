name: Inspect R1539 order integration
on:
  pull_request:
    branches: [aaa-liara-release]
    paths:
      - 'scripts/inspect-r1539-order-paths.cjs'
      - '.github/workflows/inspect-r1539-order.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source (no data access)
        run: node scripts/inspect-r1539-order-paths.cjs
