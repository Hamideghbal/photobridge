name: Verify PhotoBridge release

on:
  push:
    branches:
      - main
      - feature/admin-entity-subscription-discounts-counts-20261010
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-verification:
    name: Build and verify deploy payload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Check changed JavaScript syntax
        run: |
          node --check dist/api/server.js
          node --check dist/web/photobridge-v904r19-admin-stores.js
          node --check dist/web/photobridge-r100f90-entity-discount-activation.js
      - name: Run production build
        run: npm run build
      - name: Verify cross-device automatic commitment print receiver
        run: |
          node --check dist/web/photobridge-r1087-commitment-autoprint.js
          node --test scripts/test-r1087-commitment-autoprint.cjs
          node --check scripts/enable-r1094-windows-print-handovers.mjs
          node --test scripts/test-r1094-windows-print-fix.cjs
      - name: Check candidate download settings JavaScript
        run: node --check dist/web/photobridge-store-desktop-install-r60.js
      - name: Verify first-party persistent Windows installer
        run: |
          node --check scripts/reassemble-r1091-store-installer.mjs
          node --check dist/web/photobridge-store-desktop-install-r60.js
          node scripts/verify-r1091-persistent-installer.mjs
      - name: Independently test downloaded Windows ZIP with Python standard library
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          directory = Path('dist/web/downloads/store-desktop')
          name = 'PhotoBridge-Store-R1089-Setup-1.0.3-x64.exe'
          archive = directory / name.replace('.exe', '.zip')
          spec = json.loads(Path('dist/installer-source/store-r1089/manifest.json').read_text())
          with zipfile.ZipFile(archive) as z:
              assert z.namelist() == [name], z.namelist()
              assert z.testzip() is None, 'ZIP CRC failed'
              digest = hashlib.sha256()
              with z.open(name) as source:
                  for chunk in iter(lambda: source.read(256*1024), b''):
                      digest.update(chunk)
              assert digest.hexdigest() == spec['sha256']
          print('ZIP is readable with standard unzip and its EXE matches the trusted SHA256')
          PY
      - name: Verify desktop inventory filtering
        run: |
          node --check dist/api/storeDesktopSync.js
          node --test scripts/test-r1093-desktop-inventory-filter.cjs
      - name: Verify customer stock modes and incoming order shortages
        run: |
          node --check dist/api/server.js
          node --check dist/web/photobridge-r1095-customer-stock.js
          node --check dist/web/photobridge-r1095-owner-stock.js
          node --test scripts/test-r1095-customer-stock-modes.cjs
      - name: Verify photographer storefront channels and stable stock cards
        run: |
          node --check dist/web/photobridge-r1096-photographer-store.js
          node --check dist/web/photobridge-r1095-customer-stock.js
          node --test scripts/test-r1096-photographer-store.cjs
          node --test scripts/test-r1095-customer-stock-modes.cjs
      - name: Verify photographer navigation settings
        run: |
          node --check dist/api/photographer-tab-settings.js
          node --check dist/web/photobridge-r1099-photographer-tabs.js
          node --test scripts/test-r1099-tab-settings.cjs
      - name: Verify revoked originating laboratory releases photographer discovery
        run: |
          node --check scripts/enable-r1105-lab-origin-release.mjs
          node --test scripts/test-r1105-lab-origin-release.cjs
      - name: Verify desktop photographer Store page navigation
        run: node --test scripts/test-r1123-photographer-desktop-store.cjs
      - name: Verify primary-device restriction for local laboratory intake
        run: |
          node --check dist/web/photobridge-r1137-lab-local-intake.js
          node --check dist/web/photobridge-r1147-lab-admin-header.js
          node --check dist/web/photobridge-r1151-lab-mobile-print-navigation.js
          node --test scripts/test-r1148-lab-profile-image.cjs
          node --test scripts/test-r1138-primary-intake-api.cjs scripts/test-r1142-intake-copies-customer.cjs
          node --test scripts/test-r1143-inline-customer-preregistration.cjs
          node --check dist/web/photobridge-r1144-lab-invite-existing.js
          node --test scripts/test-r1144-lab-invite-existing.cjs
          node --test scripts/test-r1145-local-folder-primary-auto.cjs
      - name: Verify photographer mobile orders and one-row navigation
        run: |
          node --check dist/web/photobridge-r1122-mobile-print-orders.js
          node --test scripts/test-r1122-mobile-print-orders.cjs
      - name: Verify photo print quantities, filename and mobile navigation
        run: node --test scripts/test-r1132-photo-print-copies.cjs
      - name: Verify photographer mobile bottom navigation never wraps into two rows
        run: node --test scripts/test-r1134-photographer-mobile-bottom-nav.cjs
      - name: Verify complete deployment payload
        run: npm run verify:full
      - name: Prepare runner PostgreSQL for migration smoke test
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER ROLE postgres PASSWORD 'photobridge_test'"
          sudo -u postgres createdb photobridge_test
      - name: Verify mobile-based test institution access in PostgreSQL
        env:
          PB_TEST_DATABASE_URL: postgresql://postgres:photobridge_test@127.0.0.1:5432/photobridge_test
        run: |
          node --check dist/api/test-account-visibility.js
          node --check dist/web/photobridge-r1106-mobile-store-panel.js
          node --test --test-name-pattern="real PostgreSQL" scripts/test-r1106-test-account-visibility.cjs
      - name: Verify three free galleries and concurrent creation in PostgreSQL
        env:
          PB_TEST_DATABASE_URL: postgresql://postgres:photobridge_test@127.0.0.1:5432/photobridge_test
        run: node --test scripts/test-r1108-gallery-trial.cjs
      - name: Verify gallery ordering and selection invariant
        run: |
          node --check scripts/enable-r1112-gallery-single-form.mjs
          node --test --test-name-pattern="ordering always" scripts/test-r1112-gallery-form.cjs
      - name: Verify photo gallery manager layout and print tariff save
        run: |
          node --check dist/web/assets/index-UIRefine-v655-r84.js
          node --test scripts/test-r1153-gallery-manager.cjs
          node --test scripts/test-r1159-gallery-intro-cards.cjs
          node --test scripts/test-r1163-photographer-gallery-header.cjs
          node --test scripts/test-r1164-gallery-tariff-photos.cjs
          node --test scripts/test-r1165-gallery-motion.cjs
      - name: Verify R1201 laboratory invoice and order UI
        run: |
          node --check dist/web/assets/index-UIRefine-v655-r84.js
          node --check dist/web/photobridge-r1201-lab-invoice-export.js
          node --check dist/web/photobridge-lab-birthday-v774.js
          node --check dist/web/photobridge-r1137-lab-local-intake.js
          node --test scripts/test-r1201-lab-invoice-controls.cjs
      - name: Verify gallery expiry, reminders and legacy renewals in PostgreSQL
        env:
          PB_TEST_DATABASE_URL: postgresql://postgres:photobridge_test@127.0.0.1:5432/photobridge_test
        run: node --test scripts/test-r1109-gallery-lifetime.cjs
      - name: Smoke-test store discount migration in PostgreSQL
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import pg from 'pg';
          const { Client } = pg;
          const db = new Client({host:'127.0.0.1',port:5432,user:'postgres',password:'photobridge_test',database:'photobridge_test'});
          await db.connect();
          try {
            await db.query('CREATE TABLE equipment_rental_shops(id integer PRIMARY KEY)');
            await db.query(fs.readFileSync('migrations/174_admin_entity_subscription_discount_percent.sql', 'utf8'));
            await db.query('INSERT INTO equipment_rental_shops(id) VALUES(1)');
            const first = await db.query('SELECT subscription_discount_percent FROM equipment_rental_shops WHERE id=1');
            if (Number(first.rows[0].subscription_discount_percent) !== 0) throw new Error('Incorrect default discount');
            await db.query('UPDATE equipment_rental_shops SET subscription_discount_percent=20 WHERE id=1');
            let rejected = false;
            try { await db.query('UPDATE equipment_rental_shops SET subscription_discount_percent=20.01 WHERE id=1'); }
            catch (error) { rejected = error.code === '23514'; }
            if (!rejected) throw new Error('Out-of-range discount should fail');
            await db.query(fs.readFileSync('migrations/174_admin_entity_subscription_discount_percent.sql', 'utf8'));
            console.log('Store discount migration passed: default, 20% limit and idempotence.');
          } finally { await db.end(); }
          NODE

      - name: Smoke-test strict customer stock migration in PostgreSQL
        run: node scripts/test-r1095-stock-migration-smoke.mjs
