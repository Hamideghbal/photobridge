<!doctype html>
<html lang="fa" dir="rtl">
<head>
 <meta charset="utf-8">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>به‌روزرسانی PhotoBridge</title>
 <style>
  @font-face{font-family:Vazirmatn;src:url('./assets/photobridge-vazirmatn.woff2') format('woff2');font-display:swap}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fd;color:#16253d;font-family:Vazirmatn,Tahoma,sans-serif}
  body{display:grid;place-items:center;padding:12px}.card{width:100%;max-width:470px;max-height:100%;overflow:hidden;background:#fff;border:1px solid #dfe7f2;border-radius:22px;padding:20px 24px 18px;box-shadow:0 18px 54px #18335b18}
  .brand{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #edf1f7}.logo{width:48px;height:48px;object-fit:contain}.brand small{display:block;color:#6b7b92;font-size:11px;font-weight:700}.brand strong{display:block;font-size:16px;letter-spacing:-.2px}
  .stepper{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin:15px 0 12px}.step{position:relative;display:grid;justify-items:center;gap:6px;flex:1;color:#98a5b7;font-size:10px;font-weight:700;text-align:center}.dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid #d5deea;background:#f7f9fc;color:#91a0b3;font-size:12px}.step.done,.step.active{color:#315efb}.step.done .dot,.step.active .dot{border-color:#315efb;background:#edf3ff;color:#315efb}.step.done .dot{background:#315efb;color:white}.step:not(:last-child):after{content:'';position:absolute;top:13px;right:calc(50% + 18px);width:calc(100% - 26px);height:2px;background:#e4eaf2}.step.done:not(:last-child):after{background:#9eb7ff}
  h1{font-size:18px;line-height:1.7;margin:0 0 4px}.message{font-size:12px;line-height:1.9;color:#65758b;min-height:44px;margin:0}.version{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 10px;border-radius:999px;background:#f2f6fc;color:#475c79;font-size:11px;font-weight:800}
  .progress{height:12px;border-radius:999px;background:#eaf0f8;overflow:hidden;margin:12px 0 6px}.bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#5b7cfa,#315efb);transition:width .25s ease}.progress.connecting .bar{width:8%;animation:none;opacity:.6}
  .progressInfo{display:flex;justify-content:space-between;gap:12px;color:#6d7f97;font-size:10px;font-weight:700;min-height:18px}.progressInfo b{color:#315efb;font-size:12px}.note{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;background:#f7f9fc;border:1px solid #ebf0f6;border-radius:12px;color:#74839a;font-size:10px;line-height:1.8}.note span{color:#315efb;font-size:14px;line-height:1.5}
  .actions{display:flex;gap:9px;margin-top:12px}.actions button{flex:1;min-height:42px;border:0;border-radius:11px;font:800 12px Vazirmatn,Tahoma,sans-serif;cursor:pointer}.primary{background:#315efb;color:#fff;box-shadow:0 5px 12px #315efb25}.secondary{background:#f1f4f8;color:#53647c}.actions button:focus-visible{outline:3px solid #9bb1ff;outline-offset:2px}.actions[hidden],.note[hidden],.progress[hidden],.progressInfo[hidden]{display:none}
  @media(max-width:500px){body{padding:8px}.card{padding:16px 18px;border-radius:18px}.step{font-size:9px}.brand strong{font-size:14px}}
  @media(max-height:540px){body{padding:6px}.card{padding:12px 18px}.brand{padding-bottom:8px}.logo{width:40px;height:40px}.stepper{margin:9px 0 7px}.message{min-height:0;line-height:1.6}.note{margin-top:8px;padding:7px 9px}.actions{margin-top:8px}.progress{margin-top:8px}}
 </style>
</head>
<body>
 <main class="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="message">
  <header class="brand"><img class="logo" src="./assets/photobridge.png" alt=""><div><small>به‌روزرسانی امن برنامه</small><strong>PhotoBridge Lab</strong></div></header>
  <div class="stepper" aria-label="مراحل به‌روزرسانی">
   <div class="step" data-step="available"><span class="dot">۱</span><span>بررسی نسخه</span></div>
   <div class="step" data-step="downloading"><span class="dot">۲</span><span>دریافت فایل</span></div>
   <div class="step" data-step="ready"><span class="dot">۳</span><span>نصب و اجرا</span></div>
  </div>
  <h1 id="title">به‌روزرسانی برنامه</h1>
  <p class="message" id="message">در حال اتصال به فرایند به‌روزرسانی…</p>
  <span class="version" id="version" hidden></span>
  <div class="progress" id="progress" role="progressbar" aria-label="پیشرفت به‌روزرسانی" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div class="bar" id="bar"></div></div>
  <div class="progressInfo" id="progressInfo" hidden><span id="bytes">در حال آماده‌سازی پنجره</span><b id="percent">۰٪</b></div>
  <div class="note" id="note"><span aria-hidden="true">●</span><span>در زمان دریافت، این پنجره وضعیت را نشان می‌دهد. با بستن آن، دریافت امن لغو می‌شود؛ نسخهٔ فعلی برنامه و تنظیمات حفظ می‌شوند.</span></div>
  <div class="actions" id="actions" hidden><button class="secondary" id="later" type="button">بعداً</button><button class="primary" id="primary" type="button"></button></div>
 </main>
 <script src="./update-progress-renderer.js"></script>
</body>
</html>
