name: LAB104 Web native-pipeline gate (not deploy)
on:
  push:
    branches: [fix/lab-104-web-pipeline-1907]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scheduler independently
        run: node --test scripts/test-r1907-download-scheduler.cjs
      - name: Install web build dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Generate real native UI and server bundle
        run: npm run build
      - name: Re-run behavior against final generated native bundle
        run: node --test scripts/test-r1907-download-scheduler.cjs scripts/test-r1907-final-native-worker.cjs scripts/test-r1907-verified-receipt.cjs
      - name: Verify integrated code and manifests exist
        run: |
          node --check dist/web/lab-desktop-ui/assets/index-UIRefine-v655-r84.js
          node --check dist/api/server.js
          node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('dist/web/lab-desktop-ui/manifest.json'));if(!m.files.some(x=>x.name==='assets/index-UIRefine-v655-r84.js'))process.exit(1);const s=fs.readFileSync('dist/web/lab-desktop-ui/assets/index-UIRefine-v655-r84.js','utf8');if(!s.includes('/* LAB104 R1907 scheduler integrated */'))process.exit(2);"
