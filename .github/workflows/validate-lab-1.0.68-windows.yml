name: Validate PhotoBridge Lab 1.0.68 on Windows

on:
  push:
    branches:
      - build/lab-1.0.68-download-transition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout 1.0.68 source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare integrity-checked Windows Access runtime
        run: node prepare-access-runtime.cjs
      - name: Prepare diagnostic Java tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect Java CLI entrypoint and arguments
        shell: pwsh
        continue-on-error: true
        run: |
          $jar = Join-Path (Get-Location) 'assets/photobridge-access-export.jar'
          $libs = Join-Path (Get-Location) 'assets/access-libs/*'
          & javap -c -classpath "$jar;$libs" PhotoBridgeAccess | Select-String -Pattern 'read|input.json|equals' -Context 2,2
          'public class PBArgProbe { public static void main(String[] args) { System.out.println("COUNT="+args.length); for(int i=0;i<args.length;i++)System.out.println(i+"="+args[i]); } }' | Set-Content PBArgProbe.java
          & javac PBArgProbe.java
          & .\\access-runtime\\bin\\java.exe -cp . PBArgProbe --read 'Z:\\pb-never-exists.accdb' 'فاکتورها'
      - name: Diagnose bundled Access Java --read on Windows
        shell: pwsh
        continue-on-error: true
        run: |
          $jar = Join-Path (Get-Location) 'assets/photobridge-access-export.jar'
          $libs = Join-Path (Get-Location) 'assets/access-libs/*'
          & .\\access-runtime\\bin\\java.exe -cp "$jar;$libs" PhotoBridgeAccess --read 'Z:\\pb-never-exists.accdb' 'فاکتورها'
          Write-Host "Java --read diagnostic exit code: $LASTEXITCODE"
      - name: Run native regression tests on Windows
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem -Path test -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          if ($testFiles.Count -eq 0) { throw 'No regression tests found' }
          & node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify unsigned Windows installer candidate
        run: npm run dist:unsigned
      - name: Upload test-only Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: photobridge-lab-1.0.68-unsigned-test-installer
          path: release/PhotoBridge-Lab-Setup-1.0.68-x64.exe
          if-no-files-found: error
          retention-days: 14
