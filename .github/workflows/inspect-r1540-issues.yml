name: Inspect R1540 UI issues
on:
  pull_request:
    branches: [aaa-liara-release]
    paths:
      - 'scripts/inspect-r1540-issues.cjs'
      - '.github/workflows/inspect-r1540-issues.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source (read only)
        run: node scripts/inspect-r1540-issues.cjs
