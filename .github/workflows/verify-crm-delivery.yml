name: Verify CRM delivery
on:
  push:
    branches: [fix/crm-production-delivery]
permissions:
  contents: read
jobs:
  inspect-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public CRM responses without customer credentials
        run: node scripts/verify-crm-live.mjs --inspect
