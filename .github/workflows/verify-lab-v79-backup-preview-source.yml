name: Verify and package Lab 1.0.79 SOURCE (no build)
on:
  push:
    branches:
      - build/lab-1.0.79-backup-finance-preview-source
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Lab 1.0.79 source
        uses: actions/checkout@v4
      - name: Node 22 for unit tests only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm original Windows version is unchanged
        run: node -e "const p=require('./package.json');if(p.version!=='1.0.79')throw Error('not_v1.0.79')"
      - name: Verify only offline viewer and existing backup regressions
        run: |
          node --check backup-finance-viewer.cjs
          node --test test/backup-finance-viewer.test.cjs test/data-backups.test.cjs
      - name: Package raw source WITHOUT building executable, installer, or Electron assets
        run: git archive --format=zip --output=PhotoBridge-Lab-1.0.79-Backup-Finance-SOURCE.zip HEAD
      - name: Upload raw source archive
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-Lab-1.0.79-Backup-Finance-SOURCE
          path: PhotoBridge-Lab-1.0.79-Backup-Finance-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
