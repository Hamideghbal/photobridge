name: Apply R1250 scoped large-source edits
on:
  push:
    branches:
      - feature/r1250-shop-sms-business-category-frame-compact
    paths:
      - .github/workflows/r1250-large-source-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/r1250-shop-sms-business-category-frame-compact
          persist-credentials: true
      - name: Apply guarded patches to existing production files
        run: |
          node scripts/patch-r1250-server.mjs
          node scripts/patch-r1250-portals.mjs
          node --check dist/api/server.js
      - name: Commit scoped changes on feature branch
        run: |
          git config user.name 'PhotoBridge Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/api/server.js dist/api/equipment-rental-portal.html dist/api/equipment-rental-book.html
          if ! git diff --cached --quiet; then
            git commit -m 'R1250 implement production SMS and settings in main portal sources'
            git push origin HEAD:feature/r1250-shop-sms-business-category-frame-compact
          fi

# Retry once after fixing final HTML insertion anchor.
