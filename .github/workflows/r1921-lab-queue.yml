name: R1921 lab queue safety and pagination
on:
  push:
    branches: [fix/r1921-lab-queue-legacy-cleanup-pagination]
  pull_request:
    branches: [aaa-liara-release]
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server and UI syntax
        run: |
          node --check dist/api/server.js
          node --check dist/api/lab-order-pages.cjs
          node --check dist/web/assets/index-UIRefine-v655-r84.js
      - name: Check R1921 paging, search and non-destructive hide
        run: node --test scripts/test-r1921-lab-queue.cjs
