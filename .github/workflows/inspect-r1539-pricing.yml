name: Inspect R1539 lab price catalogs
on:
  pull_request:
    branches: [aaa-liara-release]
    paths:
      - 'scripts/inspect-r1539-pricing.cjs'
      - '.github/workflows/inspect-r1539-pricing.yml'
      - 'scripts/enable-r1539-*'
      - 'scripts/test-r1539-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source read-only (no data access)
        run: node scripts/inspect-r1539-pricing.cjs
      - name: Verify R1539 catalog UI and backend without full build
        run: |
          node scripts/enable-r1539-paper-binding-catalog.mjs
          node scripts/enable-r1539-paper-binding-ui.mjs
          node --test scripts/test-r1539-paper-binding-catalog.cjs
