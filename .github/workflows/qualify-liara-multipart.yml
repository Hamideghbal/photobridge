name: Qualify Liara multipart for Phase 2
on:
  push:
    branches: [feature/phase2-durable-multipart-upload]
    paths:
      - tools/qualification/**
      - .github/workflows/qualify-liara-multipart.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: phase2-liara-provider-qualification
  cancel-in-progress: false
jobs:
  diagnose-existing-session:
    name: Read-only independent SDK diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing empty probe identifiers
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43637908365
          name: liara-multipart-capability-report
          path: work/prior-probe
      - name: Install independent SDK
        run: python -m pip install boto3==1.40.74
      - name: Compare Python signing, regions and addressing without creating uploads
        env:
          S3_ENDPOINT: ${{ secrets.PHASE2_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.PHASE2_S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.PHASE2_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.PHASE2_S3_SECRET_KEY }}
        run: python tools/qualification/diagnose-liara-boto3.py
      - name: Save redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liara-independent-sdk-diagnostics
          path: work/liara-boto3-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
