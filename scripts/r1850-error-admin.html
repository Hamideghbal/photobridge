<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری خطاهای PhotoBridge</title><style>body{font-family:Tahoma,sans-serif;margin:24px;background:#f4f7fb;color:#16314b}article{background:white;border:1px solid #cad7e8;border-radius:12px;padding:16px;margin:12px 0}code{direction:ltr;display:inline-block}button{padding:10px}p{line-height:1.9}#state{color:#993333}</style><h1>پیگیری خطاهای برنامه</h1><p>خطاهای تکراری تجمیع می‌شوند. سقف هشدار پیامکی ۶ پیام در ساعت برای هر نمونهٔ برنامه است. دریافت هشدار به دسترسی برنامه و سرویس پیامک وابسته است.</p><button id="refresh">تازه‌سازی</button><p id="state"></p><main id="items"></main><script>
const state=document.getElementById('state'),items=document.getElementById('items');
async function refresh(){try{const r=await fetch('/api/admin/error-incidents',{credentials:'same-origin'});if(!r.ok)throw Error(r.status===403||r.status===401?'با حساب ادمین وارد شوید.':'دریافت گزارش‌ها ناموفق بود: '+r.status);const data=await r.json();items.replaceChildren();state.textContent=data.length?'':'خطایی ثبت نشده است.';for(const row of data){const article=document.createElement('article');for(const text of [row.id,'آخرین رخداد: '+new Date(row.lastAt).toLocaleString('fa-IR'),'کانال: '+({database:'دیتابیس',object_storage:'فضای ذخیره‌سازی',storage_capacity:'ظرفیت فضای ذخیره‌سازی',network_path:'مسیر ارتباط',browser:'مرورگر',application:'برنامه'}[row.channel]||row.channel),row.diagnosis,'بخش: '+row.source+' / '+row.stage,'کد: '+row.code+' / HTTP '+row.status,'مسیر: '+row.route,'شناسهٔ سرویس: '+(row.providerRequestId||'در دسترس نیست'),'تعداد: '+row.count,'وضعیت پیامک: '+({sent:'ارسال‌شده',failed:'ناموفق',pending:'در حال ارسال',queued:'در صف'}[row.alertState]||row.alertState),'خطای پیامک: '+(row.alertError||'—'),'شناسه‌های پیگیری: '+(row.references||[]).join('،')]){const p=document.createElement('p');p.textContent=text;article.append(p)}items.append(article)}}catch(e){state.textContent=e.message}}
document.getElementById('refresh').onclick=refresh;refresh();setInterval(refresh,30000);
</script><script src="/photobridge-upload-statistics-r1850.js?v=1850"></script></html>
