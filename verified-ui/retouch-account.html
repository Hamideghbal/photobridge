<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>سفارش‌های روتوش من | PhotoBridge</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}html{font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:#f5f7fb;color:#111827;font-size:13.5px}body{margin:0;background:#f5f7fb;color:#111827}button,input{font:inherit}.top{position:sticky;top:0;z-index:5;height:64px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:#4f46e5;text-decoration:none;font-size:17px;letter-spacing:-.2px}.home{color:#4b5563;text-decoration:none;font-weight:700;font-size:12px}.wrap{max-width:980px;margin:26px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(15,23,42,.025);margin-bottom:12px}h1{font-size:24px;line-height:1.4;margin:0 0 6px;letter-spacing:-.3px}h2{font-size:16px}.muted{color:#6b7280;line-height:1.85;font-size:11.5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:#4b5563}.field input{height:40px;border:1px solid #dfe3ea;border-radius:8px;padding:0 10px;background:#fff;color:#111827;outline:none;font-size:13.5px}.field input:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px #eef2ff}.btn{min-height:38px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:8px 14px}.btn:hover{filter:brightness(.98)}.btn.ghost{background:#fff;color:#4b5563;border:1px solid #e5e7eb}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.orders{display:grid;gap:9px}.order{border:1px solid #eef0f4;border-radius:11px;padding:11px;background:#fff}.order h3{margin:0 0 5px;font-size:12.5px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#4338ca;font-size:10px;font-weight:900}.danger{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.timer{font-weight:800;color:#b45309;font-size:11px;margin-top:3px}.error{color:#991b1b;margin-top:8px;font-size:11px}.hidden{display:none}.bridge{padding:9px 11px;border-radius:10px;background:#eef2ff;color:#4338ca;font-size:10.5px;font-weight:800;margin-bottom:10px;border:1px solid #c7d2fe}#accountName{font-size:12.5px}#accountMobile{font-size:10.5px}#ordersCard>.row{min-height:38px}@media(max-width:640px){.top{height:60px;padding:0 14px}.grid{grid-template-columns:1fr}.wrap{margin-top:16px;padding:0 12px}h1{font-size:20px}.card{padding:14px}.btn{font-size:11.5px}}
</style></head><body><header class="top"><a class="home" href="/">خانه</a><a class="brand" href="/">PhotoBridge</a></header><main class="wrap"><section class="card"><h1>سفارش‌های روتوش من</h1><div class="muted">با همان حساب روتوش وارد شو. اگر در همین مرورگر با حساب ادمین وارد باشی، PhotoBridge به‌صورت خودکار همان نشست را برای سفارش‌های روتوش فعال می‌کند.</div></section><section id="loginCard" class="card"><div id="bridgeNote" class="bridge hidden">در حال بررسی حساب فعال…</div><form id="loginForm" autocomplete="off" novalidate><div class="grid"><label class="field"><span>شماره موبایل</span><input id="mobile" name="pb591-retouch-mobile" type="tel" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="09xxxxxxxxx"></label><label id="passwordField" class="field hidden"><span>رمز ورود</span><input id="password" name="pb591-retouch-secret" type="password" autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-bwignore="true"></label></div><div class="row" style="margin-top:14px"><button id="loginBtn" type="submit" class="btn">ادامه</button><a class="btn ghost" style="display:inline-flex;align-items:center;text-decoration:none" href="/ai">روتوش جدید</a></div><div id="loginError" class="error"></div></form></section><section id="accountCard" class="card hidden"><div class="row" style="justify-content:space-between"><div><b id="accountName"></b><div id="accountMobile" class="muted"></div></div><button id="logoutBtn" class="btn ghost">خروج</button></div></section><section id="ordersCard" class="card hidden"><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:20px">سفارش‌ها</h2><a href="/ai" class="btn" style="display:inline-flex;align-items:center;text-decoration:none">روتوش جدید</a></div><div id="orders" class="orders" style="margin-top:15px"></div></section></main><script>
const $=s=>document.querySelector(s);const fa=n=>new Intl.NumberFormat('fa-IR').format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function remain(iso){if(!iso)return'';let sec=Math.max(0,Math.floor((new Date(iso).getTime()-Date.now())/1000)),d=Math.floor(sec/86400);sec%=86400;let h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60),s=sec%60;return `${fa(d)} روز، ${fa(h)}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
async function raw(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>null);return {r,j}}
async function api(url,opt={}){const {r,j}=await raw(url,opt);if(!r.ok)throw Object.assign(new Error(j?.error||'request_failed'),{status:r.status,data:j||{}});return j}
let orders=[];function render(){const box=$('#orders');box.innerHTML='';if(!orders.length){box.innerHTML='<div class="muted">هنوز سفارش روتوشی برای این حساب ثبت نشده است.</div>';return}for(const o of orders){const expired=o.fileExpired||o.expiresAt&&new Date(o.expiresAt)<=new Date();const el=document.createElement('article');el.className='order';el.innerHTML=`<div class="row" style="justify-content:space-between"><h3>${esc(o.planTitle||'روتوش عکس')}</h3><span class="pill ${expired?'danger':o.status==='completed'?'good':''}">${expired?'فایل حذف شده':o.status==='completed'?'آماده دانلود':esc(o.status||'در حال پردازش')}</span></div><div class="muted">مبلغ: ${fa(o.amount)} تومان</div>${o.expiresAt?`<div class="muted">مهلت نگهداری: ${new Date(o.expiresAt).toLocaleString('fa-IR')}</div>`:''}${!expired&&o.expiresAt?`<div class="timer" data-expiry="${esc(o.expiresAt)}">زمان باقی‌مانده: ${remain(o.expiresAt)}</div>`:''}<div class="row" style="margin-top:10px"><a class="btn ${expired?'ghost':''}" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(o.orderUrl)}">مشاهده سفارش</a></div>`;box.appendChild(el)}}
function showLoggedOut(){ $('#loginCard').classList.remove('hidden');$('#accountCard').classList.add('hidden');$('#ordersCard').classList.add('hidden') }
async function currentMe(){const {r,j}=await raw('/api/auth/me');return r.ok&&j?.user?j:null}
async function bridgeAdmin(){try{const {r}=await raw('/api/public/retouch-account/admin-bridge',{method:'POST',headers:{'x-photobridge-portal':'admin'},body:'{}'});return r.ok}catch{return false}}
async function load(tryBridge=true){try{let me=await currentMe();if(!me&&tryBridge&&sessionStorage.getItem('pb591SkipAdminBridge')!=='1'){const note=$('#bridgeNote');note.classList.remove('hidden');const ok=await bridgeAdmin();note.classList.add('hidden');if(ok)me=await currentMe()}if(!me){showLoggedOut();return}sessionStorage.removeItem('pb591SkipAdminBridge');$('#loginCard').classList.add('hidden');$('#accountCard').classList.remove('hidden');$('#ordersCard').classList.remove('hidden');$('#accountName').textContent=me.user?.name||'حساب روتوش';$('#accountMobile').textContent=me.user?.mobile||'';orders=(await api('/api/public/retouch-account/orders')).orders||[];render()}catch{showLoggedOut()}}
function normalizeMobile(v){let x=String(v||'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\D/g,'');if(x.startsWith('0098'))x='0'+x.slice(4);else if(x.startsWith('98'))x='0'+x.slice(2);else if(x.length===10&&x.startsWith('9'))x='0'+x;return x.slice(0,11)}
function scrubMobile(){const el=$('#mobile');if(!el)return'';const raw=String(el.value||'');if(raw.includes('@')||/[A-Za-z]/.test(raw)){el.value='';return''}const n=normalizeMobile(raw);if(el.value!==n)el.value=n;return n}
$('#mobile').addEventListener('input',scrubMobile);$('#mobile').addEventListener('focus',scrubMobile);window.addEventListener('pageshow',()=>{scrubMobile();setTimeout(scrubMobile,50);setTimeout(scrubMobile,350)});
let passStep=false;$('#loginForm').onsubmit=async(e)=>{e.preventDefault();$('#loginError').textContent='';const mobile=scrubMobile();if(!/^09\d{9}$/.test(mobile)){ $('#loginError').textContent='شماره موبایل معتبر وارد کن.';return }if(!passStep){passStep=true;$('#passwordField').classList.remove('hidden');$('#loginBtn').textContent='ورود';$('#password').focus();return}const password=$('#password').value;if(!password){$('#loginError').textContent='رمز ورود را وارد کن.';return}try{let ok=false;const first=await raw('/api/public/retouch-account/login',{method:'POST',body:JSON.stringify({mobile,password})});if(first.r.ok)ok=true;if(!ok){const admin=await raw('/api/auth/admin-login',{method:'POST',headers:{'x-photobridge-portal':'admin'},body:JSON.stringify({mobile,password})});if(admin.r.ok)ok=await bridgeAdmin()}if(!ok)throw Object.assign(new Error(first.j?.error||'invalid_credentials'),{data:first.j||{}});$('#password').value='';await load(false)}catch(e){const code=String(e?.data?.error||e?.message||'');$('#loginError').textContent=code==='mobile_ambiguous'?'برای این شماره چند حساب وجود دارد؛ با پشتیبانی تماس بگیر.':'شماره موبایل یا رمز ورود درست نیست.'}};
$('#logoutBtn').onclick=async()=>{sessionStorage.setItem('pb591SkipAdminBridge','1');await api('/api/auth/logout',{method:'POST',body:'{}'}).catch(()=>{});location.reload()};setInterval(()=>document.querySelectorAll('[data-expiry]').forEach(x=>{const iso=x.dataset.expiry;if(new Date(iso)<=new Date())location.reload();else x.textContent='زمان باقی‌مانده: '+remain(iso)}),1000);load();
</script></body></html>
