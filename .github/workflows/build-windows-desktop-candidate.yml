name: Build Windows desktop candidate

on:
  pull_request:
    paths:
      - "desktop-sources/**"
      - "apps/store-desktop/**"
      - "apps/lab-desktop/**"
      - "scripts/integrate-r1386-native-storage.cjs"
      - "scripts/test-r1386-*.cjs"
      - "dist/api/lab-storage-target.js"
      - "scripts/enable-r1296-native-alerts.mjs"
      - "scripts/enable-r1342-lab-ui-update.mjs"
      - "scripts/prepare-lab-installer-assets.mjs"
      - "scripts/test-r1343-lab-installer-build.cjs"
      - "scripts/test-r1342-lab-ui-update.cjs"
      - "scripts/test-r1342-native-integration.cjs"
      - "scripts/test-r1296-native-alerts.cjs"
      - "scripts/enable-r1263-desktop-frame-orders.mjs"
      - ".github/workflows/build-windows-desktop-candidate.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Desktop application to build
        type: choice
        options: [lab, store, both]
        default: lab
        required: true

permissions:
  contents: read

jobs:
  store-windows-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'lab'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore native app sources and preserve up-to-date overlays
        shell: pwsh
        run: |
          Copy-Item apps/store-desktop/desktop-overlay.js "$env:RUNNER_TEMP/store-overlay.js"
          Copy-Item apps/lab-desktop/desktop-overlay.js "$env:RUNNER_TEMP/lab-overlay.js"
          Expand-Archive -LiteralPath desktop-sources/PhotoBridge-Desktop-Sources-R1089.zip -DestinationPath . -Force
          Copy-Item "$env:RUNNER_TEMP/store-overlay.js" apps/store-desktop/desktop-overlay.js -Force
          Copy-Item "$env:RUNNER_TEMP/lab-overlay.js" apps/lab-desktop/desktop-overlay.js -Force
      - name: Enable offline frame manual orders in native candidate
        run: node scripts/enable-r1263-desktop-frame-orders.mjs
      - name: Verify saved source archive checksum
        shell: pwsh
        run: |
          $hash=(Get-FileHash desktop-sources/PhotoBridge-Desktop-Sources-R1089.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '49788a4b7db76696742a9ebdfc054b71029993c76677fcf5da95d94085f2dad0') { throw "Unexpected Windows source checksum" }
      - name: Prepare current prebuilt Windows store UI payload
        run: node scripts/prepare-store-desktop-ui.mjs
      - name: Test and package native store app
        shell: pwsh
        run: |
          Push-Location apps/store-desktop
          npm ci --no-audit --no-fund
          npm test
          npm run dist:unsigned
          Pop-Location
      - name: Publish unsigned test setup
        uses: actions/upload-artifact@v4
        with:
          name: photobridge-store-r1089-windows-test-installer
          path: apps/store-desktop/release/*Setup*.exe
          if-no-files-found: error
          retention-days: 14


  lab-windows-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'store'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore current lab source and integrate configured storage
        shell: pwsh
        run: |
          Copy-Item apps/lab-desktop/desktop-overlay.js "$env:RUNNER_TEMP/lab-overlay.js"
          Copy-Item apps/lab-desktop/ui-update.cjs "$env:RUNNER_TEMP/lab-ui-update.cjs"
          $sourceHash=(Get-FileHash desktop-sources/PhotoBridge-Lab-Source-v1.0.22.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne '5fcd7e991f6f95008f375ac10ff036ea3abd89997118738e325d67a8c0df89aa') { throw "Unexpected laboratory source checksum" }
          Expand-Archive -LiteralPath desktop-sources/PhotoBridge-Lab-Source-v1.0.22.zip -DestinationPath "$env:RUNNER_TEMP/lab-current" -Force
          Copy-Item "$env:RUNNER_TEMP/lab-current/PhotoBridge-Lab-Source-v1.0.22/*" apps/lab-desktop -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP/lab-overlay.js" apps/lab-desktop/desktop-overlay.js -Force
          Copy-Item "$env:RUNNER_TEMP/lab-ui-update.cjs" apps/lab-desktop/ui-update.cjs -Force
          node scripts/integrate-r1386-native-storage.cjs apps/lab-desktop
          if ($LASTEXITCODE -ne 0) { throw "Storage integration failed" }
          node scripts/integrate-r1388-lab-expiry.cjs apps/lab-desktop
          if ($LASTEXITCODE -ne 0) { throw "Native storage integration failed" }
      - name: Verify configured-path activation
        run: node --test scripts/test-r1386-storage-target.cjs scripts/test-r1386-configured-native.cjs
      - name: Prepare current lab UI
        run: node scripts/prepare-lab-desktop-ui.mjs
      - name: Prepare missing installer icons from existing PhotoBridge artwork
        run: node scripts/prepare-lab-installer-assets.mjs
      - name: Verify native installer readiness
        run: node --test scripts/test-r1343-lab-installer-build.cjs
      - name: Test and package native lab app
        shell: pwsh
        run: |
          Push-Location apps/lab-desktop
          npm ci --no-audit --no-fund
          npm test
          npm run dist:unsigned
          Pop-Location
      - name: Publish lab Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: photobridge-lab-1.0.25-windows-test-installer
          path: apps/lab-desktop/release/*Setup*.exe
          if-no-files-found: error
          retention-days: 14

