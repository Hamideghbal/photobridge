name: Archive complete Lab Windows SOURCE permanently (manual draft)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful full-source Windows Actions build run ID'
        required: true
        type: string
      version:
        description: 'Exact version, e.g. 1.0.105'
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch source-complete artifact from an explicit successful build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]{4,15}$ ]] || exit 10
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 11
          mkdir -p source-artifact
          gh run download "$BUILD_RUN" --repo "$REPOSITORY" -n lab-windows-next-version-full-sources-UNSIGNED-NOT-PUBLISHED -D source-artifact
          node -e '
            const fs=require("fs"),crypto=require("crypto"),v=process.env.VERSION;
            const p=`source-artifact/PhotoBridge-Lab-ReleaseInfo-${v}.json`;
            if(!fs.existsSync(p))throw Error("release_info_missing");
            const m=JSON.parse(fs.readFileSync(p));
            if(m.version!==v||!/^([a-f0-9]{40})$/.test(m.nativeCommit)||!/^([a-f0-9]{40})$/.test(m.webCommit))throw Error("provenance_invalid");
            const src="source-artifact/"+m.sourceArchive;
            if(!fs.existsSync(src))throw Error("source_missing");
            if(crypto.createHash("sha256").update(fs.readFileSync(src)).digest("hex")!==m.sourceSHA256)throw Error("full_source_hash_mismatch");
            fs.writeFileSync("source-artifact/NATIVE_COMMIT",m.nativeCommit);
          '
      - name: Keep versioned source available after temporary CI artifact expires
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(cat source-artifact/NATIVE_COMMIT)"
          git cat-file -e "$SOURCE_COMMIT^{commit}" || { git fetch --depth=1 origin "$SOURCE_COMMIT"; git cat-file -e "$SOURCE_COMMIT^{commit}"; }
          TAG="lab-source-v$VERSION"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Source release already exists; refusing to replace immutable version $TAG."
            exit 14
          fi
          gh release create "$TAG" "source-artifact/PhotoBridge-Lab-FullSource-$VERSION.zip" "source-artifact/PhotoBridge-Lab-ReleaseInfo-$VERSION.json" --repo "$REPOSITORY" --target "$SOURCE_COMMIT" --title "PhotoBridge Lab full source $VERSION — PRIVATE DRAFT" --notes "Permanent FULL native source and exact web/server commit+verified UI source ZIP. No production executable, installer signing or update JSON is published by this operation. Review release provenance before creating an actual signed software release." --draft
# This manually creates an immutable PRIVATE/DRAFT GitHub Release containing
# source inputs. Never triggers a website deployment, stable installer
# publication, in-app update, or repository merge.
