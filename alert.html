<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; font-src 'self'; img-src https:; style-src 'unsafe-inline'"><title>اعلان‌ها · فوتوبریج</title>
<style>
@font-face{font-family:Vazirmatn;src:url('assets/photobridge-vazirmatn.woff2') format('woff2');font-style:normal;font-weight:400;font-display:block}
*{box-sizing:border-box}html{background:#fff}body{margin:0;padding:20px 22px 14px;color:#172b43;font:13px/1.75 Vazirmatn,sans-serif}button,select,input{font:inherit}button,summary,select{cursor:pointer}header{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #dce8fd;background:#edf4ff;color:#245fd3;border-radius:13px;flex:none}.brand{font-size:10px;color:#8390a2;letter-spacing:1.5px;line-height:1.4;font-family:Vazirmatn,sans-serif;direction:ltr;text-align:right}h1{font-size:17px;line-height:1.7;font-weight:700;margin:2px 0 0}#hint{font-size:11px;color:#7b8798;margin:10px 0 0}#items{margin:12px 0;max-height:300px;overflow:auto;overscroll-behavior:contain}.order{padding:10px 12px;background:#f7f9fc;border:1px solid #e8edf5;border-radius:10px;margin:7px 0}.order strong{display:block;font-size:12px;font-weight:700;overflow-wrap:anywhere}.order span{display:block;color:#64748b;font-size:11px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:unset;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:8px;margin-top:12px}button{border:1px solid #dce3ee;border-radius:9px;padding:9px 14px;background:white;color:#3d4e66;font-size:12px;min-height:38px;transition:background .15s}button:hover{background:#f7f9fc}button.primary{background:#245fd3;color:#fff;border-color:#245fd3;flex:1}button.primary:hover{background:#1e51b5}button:disabled{opacity:.55;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #a6c6ff;outline-offset:2px}details{border-top:1px solid #e8edf4;margin-top:16px;padding-top:9px}summary{color:#68788f;font-size:11px;list-style:none;display:flex;align-items:center;gap:6px;width:fit-content;user-select:none}summary::-webkit-details-marker{display:none}summary::after{content:'⌄';font:14px sans-serif;margin-right:3px}details[open] summary::after{content:'⌃'}details[open] summary{color:#245fd3;margin-bottom:8px}.setting-fields{padding:2px 0 0}label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;color:#4e5d73;font-size:12px}select{max-width:210px;width:194px;background:#fafbfe;color:#263c59;border:1px solid #dfe6ef;border-radius:8px;padding:6px 8px;outline:none}input[type=range]{width:140px;accent-color:#245fd3;vertical-align:middle}output{font-size:11px;color:#6d7e94;display:inline-block;min-width:32px}.settings-footer{display:flex;align-items:center;gap:10px;margin-top:14px}#test{font-size:11px;padding:5px 12px;min-height:30px;background:#f6f9fe}small{font-size:10px;color:#8b96a6}#status{color:#b54838;font-size:11px;line-height:1.8;overflow-wrap:anywhere}#status:not(:empty){margin-top:9px}[hidden]{display:none!important}
.order img{display:block;width:100%;max-height:180px;object-fit:contain;border-radius:7px;margin-top:8px;background:#f1f4f8}.order span{white-space:pre-wrap}#items{scrollbar-width:thin;scrollbar-color:#91a2ba #edf2f7}.quickReply{display:grid;gap:7px;margin-top:10px}.quickReply textarea{font:12px/1.8 Vazirmatn,Tahoma,sans-serif;direction:rtl;text-align:right;width:100%;min-height:64px;resize:vertical;border:1px solid #cfdae5;border-radius:8px;padding:8px;background:#fff}.quickReply button{justify-self:end;background:#245fd3;color:#fff;padding:6px 13px;min-height:32px}
#downloads{max-height:180px;overflow:auto;margin-top:10px}.download{padding:9px 12px;border:1px solid #dce8fd;border-radius:10px;margin:6px 0;background:#f1f6ff}.download strong{font-size:11px}.download small{display:block;color:#536984}.download progress{display:block;width:100%;height:7px;accent-color:#245fd3;margin-top:7px}.download.failed{background:#fff6ee;border-color:#ffd6b2}.download.verified progress{accent-color:#21956c}
.retryDownload{margin-top:8px;min-height:30px;padding:4px 10px;border-color:#d1dfff;color:#245fd3;background:#fff;font-size:11px}
</style>
<header><div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 21h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="19" cy="4" r="3" fill="#245fd3" stroke="white" stroke-width="1.7"/></svg></div><div><div class="brand">PHOTOBRIDGE LAB</div><h1 id="title">سفارش چاپ جدید</h1></div></header>
<p id="hint">این اعلان تا تأیید شما باز می‌ماند.</p><section id="downloads" aria-label="پیشرفت دانلود سفارش‌ها" hidden></section><section id="orders"><div id="items" aria-live="polite"></div><div class="actions"><button class="primary" id="open">باز کردن لابراتوار</button><button id="ack">همه را دیدم</button></div></section>
<details id="preferences"><summary>تنظیم صدای اعلان</summary><div class="setting-fields"><label>حالت صدا<select id="mode"><option value="silent">بی‌صدا</option><option value="gentle">آرام و یک‌باره</option><option value="repeat">تکرار تا تأیید</option></select></label><label>نوع صدا<select id="tone"><option value="bell">زنگ</option><option value="soft">ملایم</option><option value="beep">بوق کوتاه</option></select></label><label>بلندی صدا<span><input id="volume" type="range" min="0" max="100" value="50" aria-label="بلندی صدا"><output id="volumeText">۵۰٪</output></span></label><label id="intervalRow">فاصلهٔ تکرار<select id="interval"><option value="5">۵ ثانیه</option><option value="10">۱۰ ثانیه</option><option value="30">۳۰ ثانیه</option><option value="60">۱ دقیقه</option></select></label><div class="settings-footer"><button id="test">تست صدا</button><small>تغییرات خودکار ذخیره می‌شوند</small></div></div></details><div id="status" role="status"></div><script src="alert-renderer.js"></script></html>
