name: LAB104 Native candidate gates (not a release)
on:
  push:
    branches: [fix/lab-104-native-candidate-1907]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-behavior:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native syntax checks
        run: node --check main.cjs && node --check main-preload.cjs && node --check fast-order-wake.cjs && node --check alert-content.cjs && node --check order-alert-dispatch.cjs && node --check native-alerts.cjs && node --check host.cjs && node --check alert-renderer.js && node --check receipt-forward.cjs
      - name: Real notifier DOM, receipt, and realtime behavior
        run: node --test test/fast-order-wake.test.cjs test/order-alert-dispatch.test.cjs test/startup-ui.test.cjs test/native-alerts.test.cjs test/realtime-order-wake.test.cjs test/receipt-forward.test.cjs test/download-announcement-dom.test.cjs test/order-progress.test.cjs test/background-download.test.cjs
