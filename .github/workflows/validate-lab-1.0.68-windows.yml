name: Validate PhotoBridge Lab 1.0.68 on Windows

on:
  push:
    branches:
      - build/lab-1.0.68-download-transition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout 1.0.68 source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare integrity-checked Windows Access runtime
        run: node prepare-access-runtime.cjs
      - name: Prepare diagnostic Java tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and validate Access helper from checked-in source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .access-build -Force | Out-Null
          & javac --release 17 -encoding UTF-8 -cp "assets/access-libs/*" -d .access-build access-src/PhotoBridgeAccess.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & jar --create --file assets/photobridge-access-export.jar -C .access-build PhotoBridgeAccess.class
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash assets/photobridge-access-export.jar -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path access-helper.sha256 -Value $sha
          Write-Host PB_ACCESS_JAR_B64_START
          node -p "require('node:fs').readFileSync('assets/photobridge-access-export.jar').toString('base64')"
          Write-Host PB_ACCESS_JAR_B64_END
      - name: Run native regression tests on Windows
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem -Path test -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          if ($testFiles.Count -eq 0) { throw 'No regression tests found' }
          & node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify unsigned Windows installer candidate
        run: npm run dist:unsigned
      - name: Upload test-only Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: photobridge-lab-1.0.68-unsigned-test-installer
          path: release/PhotoBridge-Lab-Setup-1.0.68-x64.exe
          if-no-files-found: error
          retention-days: 14
